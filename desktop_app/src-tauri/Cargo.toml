[package]
name = "perlerdrawing-desktop"
version = "0.1.0"
description = "Offline-first perler bead pattern editor"
authors = ["PerlerDrawing contributors"]
edition = "2021"

[lib]
name = "perlerdrawing_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
